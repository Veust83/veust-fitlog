<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Veust FitLog - Stats</title>
<link rel="manifest" href="manifest.webmanifest?v=3">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="theme-color" content="#050811">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FitLog">
<link rel="stylesheet" href="style.css?v=3">
<style>
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:.25rem;background:#080c18;border:1px solid #1b2234;border-radius:.7rem;padding:.25rem}
  .seg button{padding:.55rem;border:none;border-radius:.5rem;background:transparent;color:#94a3b8;font-size:.8rem;font-weight:700;cursor:pointer}
  .seg button.on{background:#14b8a6;color:#04201d}
  .chips{display:flex;gap:.35rem;flex-wrap:wrap}
  .chip{padding:.3rem .65rem;border-radius:999px;border:1px solid #1b2234;background:#141b2d;color:#cbd5e1;font-size:.72rem;font-weight:600;cursor:pointer}
  .chip.on{background:#f1f5f9;color:#020617;border-color:#f1f5f9}
  .sel{width:100%;background:#080c18;border:1px solid #1b2234;border-radius:.5rem;padding:.55rem;color:#f1f5f9;font-size:.85rem;font-weight:600}
  .ro{display:flex;flex-direction:column;align-items:flex-start;gap:.4rem}
  .ro-val{font-size:1.5rem;font-weight:800;line-height:1.1;white-space:nowrap}
  .ro-sub{font-size:.72rem;color:#94a3b8;margin-top:.15rem}
  .ro-delta{font-size:.72rem;font-weight:700;padding:.2rem .55rem;border-radius:999px;background:#141b2d}
  .up{color:#22c55e}.down{color:#fb7185}.flat{color:#94a3b8}
  .chart{width:100%;height:auto;display:block;touch-action:manipulation}
  .chart text{font-size:9px;fill:#64748b;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .ln{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s ease-out forwards}
  .ar{opacity:0;animation:fade .7s .5s forwards}
  .pt{opacity:0;animation:fade .3s forwards;stroke:#0f1422;stroke-width:2}
  .pt.sel{stroke:#fff}
  .hit{fill:transparent;cursor:pointer}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes fade{to{opacity:1}}
</style>
</head>
<body>
<main>
  <div class="kpi-grid">
    <div class="kpi-box"><span class="kpi-lbl">Séances</span><span class="kpi-val" id="kpi-sess">-</span></div>
    <div class="kpi-box"><span class="kpi-lbl">Poids Actuel</span><span class="kpi-val green" id="kpi-bw">-</span></div>
    <div class="kpi-box"><span class="kpi-lbl">Cumul Total</span><span class="kpi-val orange" id="kpi-tot">-</span></div>
  </div>

  <div class="seg">
    <button id="seg-s" onclick="setView('s')">Par séance</button>
    <button id="seg-e" onclick="setView('e')">Par exercice</button>
  </div>

  <div id="view" style="display:flex;flex-direction:column;gap:.875rem"></div>

  <div class="card">
    <p class="hint">Avec une clé GitHub enregistrée dans Coach, les séances de cet appareil sont envoyées automatiquement dans historique.json. Sans clé, tu peux copier l'historique complet et le coller toi-même dans le fichier.</p>
    <button onclick="copyHist()" class="btn-sub">Copier l'historique complet (JSON)</button>
    <p id="cf" class="msg" style="color:#22c55e">Historique copié !</p>
    <p id="err" class="msg" style="color:#fb923c"></p>
  </div>
</main>

<script src="common.js?v=3"></script>
<script>
mountShell("stats.html");

/* ===== Données ===== */
const num=n=>(Math.round(n*10)/10).toLocaleString("fr-CH");
const shortDate=s=>String(s).split(".").slice(0,2).join(".");
let ALL=[],GROUPS=[],view="s",sMetric="tonnage",gIdx=0,eMetric="max",CUR=null;

/* Rapprochement tolérant des noms (« Curl incliné assis haltères (Banc 60°) » ~ « Curl incliné haltères (60°) ») */
const STOPW=new Set(["aux","avec","de","du","des","la","le","les","au","et","en","d","l"]);
const toks=s=>String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\(.*?\)/g," ").replace(/[^a-z0-9]+/g," ").trim().split(" ").filter(w=>w&&!STOPW.has(w));
function sameEx(a,b){
  const A=new Set(toks(a)),B=new Set(toks(b));
  if(!A.size||!B.size)return false;
  let n=0;A.forEach(w=>{if(B.has(w))n++});
  return n/(A.size+B.size-n)>=0.7;
}

/* Lit un résumé du type « 12 @ 45kg, 10 @ 45kg », « 3 × 15 @ 12kg », « 2 × 30s », « 13 min @ 0kg » */
function parseSummary(str){
  const sets=[];let maxW=0;
  String(str||"").split(/[,;&]/).forEach(part=>{
    const s=part.replace(/['’]/g,"").trim();let m;
    if(m=s.match(/(?:(\d+)\s*[×x]\s*)?(\d+)(?:\s*-\s*\d+)?\s*(?:reps?\s*)?@\s*(\d+(?:[.,]\d+)?)(?:\s*-\s*(\d+(?:[.,]\d+)?))?\s*kg/i)){
      const n=+m[1]||1,w=parseFloat((m[4]||m[3]).replace(",","."));
      for(let i=0;i<n;i++)sets.push({reps:+m[2],weight:w,unit:"reps"});
    }else if(m=s.match(/(?:(\d+)\s*[×x]\s*)?(\d+)\s*(min|sec|s)\b/i)){
      const n=+m[1]||1,u=m[3].toLowerCase()==="min"?"min":"sec";
      for(let i=0;i<n;i++)sets.push({reps:+m[2],weight:0,unit:u});
    }else if(m=s.match(/(\d+(?:[.,]\d+)?)\s*kg/i)){
      const w=parseFloat(m[1].replace(",","."));
      if(w<=400)maxW=Math.max(maxW,w);
    }
  });
  return{sets,maxW};
}
function entryStats(summary){
  const p=parseSummary(summary),r=p.sets.filter(s=>s.unit==="reps"),t=p.sets.filter(s=>s.unit!=="reps");
  const max=Math.max(p.maxW,...r.map(s=>s.weight),0);
  return{
    max:max>0?max:null,
    vol:r.some(s=>s.weight>0)?r.reduce((a,s)=>a+s.reps*s.weight,0):null,
    reps:r.length?r.reduce((a,s)=>a+s.reps,0):null,
    time:t.length?t.reduce((a,s)=>a+(s.unit==="min"?s.reps*60:s.reps),0):null
  };
}
const METRICS={
  max:{label:"Charge max",unit:"kg"},
  vol:{label:"Volume",unit:"kg"},
  reps:{label:"Répétitions",unit:"reps"},
  time:{label:"Durée",unit:"s"}
};
function buildGroups(){
  GROUPS=[];
  ALL.forEach(s=>(s.exercises||[]).forEach(ex=>{
    let g=GROUPS.find(g=>sameEx(g.name,ex.name));
    if(!g){g={name:ex.name,entries:[]};GROUPS.push(g)}
    g.entries.push({date:s.date,title:s.title,summary:ex.summary||"",st:entryStats(ex.summary)});
  }));
  GROUPS.forEach(g=>{g.metrics=Object.keys(METRICS).filter(k=>g.entries.some(e=>e.st[k]!==null))});
  GROUPS.sort((a,b)=>b.entries.length-a.entries.length||a.name.localeCompare(b.name,"fr"));
}

/* ===== Graphique en courbe animé ===== */
function chartSVG(pts,color){
  const W=320,H=170,l=40,r=14,t=14,b=24,n=pts.length,vals=pts.map(p=>p.v);
  let lo=Math.min(...vals),hi=Math.max(...vals);
  if(lo===hi){lo-=1;hi+=1}
  const pad=(hi-lo)*.18;hi+=pad;lo=Math.max(0,lo-pad);
  const X=i=>n===1?(l+W-r)/2:l+i*(W-l-r)/(n-1),Y=v=>t+(1-(v-lo)/(hi-lo))*(H-t-b);
  const xy=pts.map((p,i)=>[X(i),Y(p.v)]);
  const d=xy.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" ");
  const grid=[lo,(lo+hi)/2,hi].map(v=>`<line x1="${l}" y1="${Y(v).toFixed(1)}" x2="${W-r}" y2="${Y(v).toFixed(1)}" stroke="#1b2234" stroke-width="1"/><text x="${l-5}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end">${hi-lo<10?num(v):Math.round(v).toLocaleString("fr-CH")}</text>`).join("");
  const step=Math.max(1,Math.ceil(n/5));
  const xl=pts.map((p,i)=>(i%step===0||i===n-1)&&!(i!==n-1&&n-1-i<step*.6)?`<text x="${X(i).toFixed(1)}" y="${H-7}" text-anchor="middle">${esc(shortDate(p.date))}</text>`:"").join("");
  const dots=xy.map((q,i)=>`<circle class="pt" id="pt${i}" cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="4" fill="${color}" style="animation-delay:${(n>1?.15+i*.9/(n-1):.1).toFixed(2)}s"/><circle class="hit" cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="14" onclick="pick(${i})"/>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">
    <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    ${grid}${xl}
    ${n>1?`<path class="ar" d="${d} L${xy[n-1][0].toFixed(1)} ${H-b} L${xy[0][0].toFixed(1)} ${H-b} Z" fill="url(#ag)"/><path class="ln" pathLength="1" d="${d}" stroke="${color}"/>`:""}
    ${dots}</svg>`;
}
function chartCard(pts,color,unit,title){
  CUR={pts,unit,color};
  if(!pts.length)return `<div class="card"><span class="sec-title">${esc(title)}</span><p class="hint">Pas de donnée chiffrée pour ce choix.</p></div>`;
  return `<div class="card">
    <span class="sec-title">${esc(title)}</span>
    <div class="ro"><div><div class="ro-val" id="ro-val" style="color:${color}"></div><div class="ro-sub" id="ro-sub"></div></div><span class="ro-delta" id="ro-delta"></span></div>
    ${chartSVG(pts,color)}
    <p class="hint">${pts.length>1?"Touche un point pour voir la séance correspondante.":"Une seule séance pour l'instant : la courbe se dessinera dès la deuxième."}</p>
  </div>`;
}
function pick(i){
  if(!CUR||!CUR.pts[i])return;
  const p=CUR.pts[i],prev=CUR.pts[i-1],first=CUR.pts[0];
  CUR.pts.forEach((_,k)=>{const c=$("pt"+k);if(c){c.setAttribute("r",k===i?6:4);c.classList.toggle("sel",k===i)}});
  $("ro-val").innerText=num(p.v)+" "+CUR.unit;
  $("ro-sub").innerText=p.date+" — "+p.title;
  const el=$("ro-delta"),ref=prev||null;
  if(!ref){el.innerText=CUR.pts.length>1?"Première séance":"";el.className="ro-delta flat";el.style.display=CUR.pts.length>1?"":"none";return}
  const diff=p.v-ref.v,pct=ref.v?Math.round(diff/ref.v*100):0,tot=first.v&&i>1?Math.round((p.v-first.v)/first.v*100):0;
  el.style.display="";
  el.className="ro-delta "+(diff>0?"up":diff<0?"down":"flat");
  el.innerText=(diff>0?"▲ +":diff<0?"▼ ":"= ")+num(diff)+" "+CUR.unit+(ref.v?" ("+(pct>0?"+":"")+pct+"%)":"")+(tot?" · "+(tot>0?"+":"")+tot+"% depuis le début":"");
}

/* ===== Vues ===== */
const chips=(items,cur,fn)=>`<div class="chips">${items.map(([k,l])=>`<button class="chip${k===cur?" on":""}" onclick="${fn}('${k}')">${esc(l)}</button>`).join("")}</div>`;

function renderSessions(){
  const isT=sMetric==="tonnage";
  const pts=ALL.filter(s=>isT?s.tonnage>0:s.bodyweight>0).map(s=>({date:s.date,title:s.title,v:isT?s.tonnage:s.bodyweight}));
  const list=[...ALL].reverse().map(s=>`
    <details class="card">
      <summary>
        <div><span class="s-date">${esc(s.date)}${s.bodyweight?" • "+s.bodyweight+" kg":""}</span><span class="s-title">${esc(s.title)}</span></div>
        <div><span class="s-vol">${(s.tonnage||0).toLocaleString("fr-CH")} kg</span><span class="s-det">Détails ▾</span></div>
      </summary>
      <div class="s-body">
        ${(s.exercises||[]).map(ex=>`<div class="ex-row"><span class="ex-name">${esc(ex.name)}</span><span class="ex-sum">${esc(ex.summary)}</span></div>`).join("")}
        ${s.note?`<div class="s-note">Note : ${esc(s.note)}</div>`:""}
      </div>
    </details>`).join("");
  $("view").innerHTML=chips([["tonnage","Tonnage"],["bw","Poids du corps"]],sMetric,"setSMetric")
    +chartCard(pts,isT?"#22c55e":"#fb923c","kg",isT?"Tonnage par séance":"Poids du corps")
    +`<div class="list-title">Détail des séances enregistrées</div>`
    +(list||'<p class="hint">Aucune séance pour le moment.</p>');
  if(pts.length)pick(pts.length-1);
}

function renderExercises(){
  if(!GROUPS.length){$("view").innerHTML='<p class="hint">Aucun exercice enregistré pour le moment.</p>';return}
  const g=GROUPS[gIdx]||GROUPS[0];
  if(!g.metrics.includes(eMetric))eMetric=g.metrics[0]||"max";
  const m=METRICS[eMetric];
  let unit=m.unit,div=1;
  if(eMetric==="time"&&g.entries.every(e=>e.st.time===null||e.st.time>=120)){unit="min";div=60}
  const pts=g.entries.filter(e=>e.st[eMetric]!==null).map(e=>({date:e.date,title:e.title,v:e.st[eMetric]/div}));
  const opts=GROUPS.map((x,i)=>`<option value="${i}"${i===gIdx?" selected":""}>${esc(x.name)} (${x.entries.length} séance${x.entries.length>1?"s":""})</option>`).join("");
  const rows=[...g.entries].reverse().map(e=>`<div class="ex-row"><span class="ex-name">${esc(e.date)}</span><span class="ex-sum">${esc(e.summary)}</span></div>`).join("");
  $("view").innerHTML=`<select class="sel" onchange="setGroup(this.value)">${opts}</select>`
    +(g.metrics.length?chips(g.metrics.map(k=>[k,METRICS[k].label]),eMetric,"setEMetric"):"")
    +chartCard(pts,"#14b8a6",unit,g.metrics.length?m.label+" — "+g.name:g.name)
    +`<div class="card"><span class="sec-title">Séances de cet exercice</span><div class="s-body" style="border-top:none;padding-top:0;margin-top:0">${rows}</div></div>`;
  if(pts.length)pick(pts.length-1);
}

function render(){
  $("seg-s").className=view==="s"?"on":"";
  $("seg-e").className=view==="e"?"on":"";
  if(view==="s")renderSessions();else renderExercises();
}
function setView(v){view=v;lsSet("veust_stats_view",v);render()}
function setSMetric(k){sMetric=k;render()}
function setEMetric(k){eMetric=k;render()}
function setGroup(i){gIdx=+i;render()}

/* ===== Chargement ===== */
async function loadStats(){
  const r=await loadAllHist();
  ALL=r.sessions;
  const note=(txt,col)=>{const m=$("err");m.innerText=txt;m.style.color=col||"#fb923c";m.style.display=txt?"block":"none"};
  if(!r.src)note("historique.json introuvable : seules les séances enregistrées sur cet appareil sont affichées.");
  if(r.pending&&ghToken()){
    note("Envoi de "+r.pending+" séance"+(r.pending>1?"s":"")+" vers historique.json…","#94a3b8");
    syncHist().then(x=>{
      if(x.ok){if(x.sessions){ALL=x.sessions;buildGroups()}note(x.added?x.added+" séance"+(x.added>1?"s":"")+" ajoutée"+(x.added>1?"s":"")+" à historique.json ✅":"","#22c55e")}
      else note(x.msg);
    });
  }else if(r.pending)note(r.pending+" séance"+(r.pending>1?"s":"")+" seulement sur cet appareil. Ajoute ta clé GitHub dans Coach pour l'envoyer dans historique.json.");
  buildGroups();

  const tot=ALL.reduce((a,s)=>a+(s.tonnage||0),0);
  $("kpi-tot").innerText=(tot/1000).toFixed(1)+" t";
  $("kpi-sess").innerText=ALL.length;
  const w=ALL.filter(s=>s.bodyweight).map(s=>s.bodyweight);
  $("kpi-bw").innerText=(w.length?w[w.length-1]:getBW())+" kg";

  view=lsGet("veust_stats_view","s")==="e"?"e":"s";
  render();
}

function copyHist(){
  try{navigator.clipboard.writeText(JSON.stringify({sessions:ALL},null,2))}catch(e){}
  const f=$("cf");f.style.display="block";setTimeout(()=>f.style.display="none",3000);
}
loadStats();
</script>
</body>
</html>
