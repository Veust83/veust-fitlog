<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Veust FitLog</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <div class="card row">
    <label style="font-size:.75rem;color:#cbd5e1">Poids du jour (kg) :</label>
    <input type="number" step="0.1" id="bw" class="inp bw" oninput="setBW(this.value)">
  </div>
  <div id="list" style="display:flex;flex-direction:column;gap:.875rem"></div>
  <button onclick="finish()" class="btn-full btn-green">✅ Terminer la séance</button>
  <p id="fm" class="msg" style="color:#22c55e"></p>
</main>

<script src="common.js"></script>
<script>
/* ===== Moteur d'animation : cinématique inverse 2 segments =====
   Chaque exercice donne la position de la hanche (h), de l'épaule (s), de la main (a) et du pied (f).
   Genoux et coudes sont calculés. db:1 = haltère. Vue de profil (side_bend : vue de face). */
const D=Math.PI/180,C=Math.cos,Sn=Math.sin;
const SEAT='<rect x="22" y="61" width="30" height="4" rx="2" fill="#334155"/><rect x="19" y="24" width="5" height="40" rx="2" fill="#334155"/>';
const E={
  bike:{k:-1,e:1,hl:[['thigh',0,1]],eq:'<circle cx="52" cy="68" r="9" stroke="#334155" fill="none"/><rect x="31" y="56" width="14" height="3" rx="1" fill="#334155"/><line x1="72" y1="40" x2="72" y2="68" stroke="#334155" stroke-width="2"/>',P:(p,t)=>({h:[40,52],s:[56,32],a:[72,40],f:[52+9*C(t*5),68+9*Sn(t*5)]})},
  plank:{k:-1,e:1,hl:[['torso',.05,.6]],eq:'',P:p=>({h:[59,58+1.5*p],s:[35,56],a:[49,70],f:[95,73]})},
  leg_ext:{k:-1,e:1,hl:[['thigh',0,1]],eq:SEAT,P:p=>{const g=D*90*(1-p);return{h:[35,57],s:[34,33],a:[48,52],f:[55+20*C(g),57+20*Sn(g)]}}},
  leg_curl:{k:-1,e:1,hl:[['thigh',.1,1]],eq:SEAT,P:p=>{const g=D*(15+85*p);return{h:[35,57],s:[34,33],a:[48,52],f:[55+20*C(g),57+20*Sn(g)]}}},
  chest_push:{k:-1,e:1,hl:[['torso',.55,.95],['uarm',0,.5]],eq:SEAT,P:p=>({h:[30,58],s:[32,34],a:[40+30*p,38],f:[48,80]})},
  row_pull:{k:-1,e:1,hl:[['torso',.45,1]],eq:SEAT,P:p=>({h:[30,58],s:[32-3*p,34],a:[74-22*p,41],f:[48,80]})},
  lat_pull:{k:-1,e:1,hl:[['uarm',0,1],['torso',.5,1]],eq:SEAT+'<rect x="36" y="52" width="16" height="3" rx="1" fill="#475569"/>',P:p=>({h:[38,60],s:[40,36],a:[52+4*p,12+18*p],f:[52,82]})},
  shoulder:{k:-1,e:1,hl:[['uarm',0,.6],['torso',.8,1]],eq:SEAT,P:p=>({h:[30,58],s:[32,34],a:[44,30-22*p],f:[48,80]})},
  shrug:{k:-1,e:-1,db:1,hl:[['torso',.78,1],['uarm',0,.4]],eq:SEAT,P:p=>{const q=Math.min(1,p*1.5),sy=34-6*q;return{h:[30,58],s:[32,sy],a:[34,sy+27],f:[48,80]}}},
  curl:{k:-1,e:1,hl:[['uarm',0,1]],eq:SEAT+'<line x1="36" y1="40" x2="48" y2="54" stroke="#475569" stroke-width="5" stroke-linecap="round"/>',P:p=>{const g=D*(20-120*p);return{h:[30,60],s:[34,36],a:[43+14*C(g),47+14*Sn(g)],f:[48,82]}}},
  incline_curl:{k:-1,e:1,db:1,hl:[['uarm',0,1],['farm',0,.4]],eq:'<line x1="28" y1="66" x2="10" y2="36" stroke="#334155" stroke-width="7" stroke-linecap="round"/><rect x="24" y="64" width="20" height="4" rx="2" fill="#334155"/>',P:p=>{const g=D*(85-155*p);return{h:[34,62],s:[22,41],a:[24+14*C(g),55+14*Sn(g)],f:[56,80]}}},
  hammer:{k:-1,e:1,db:1,hl:[['uarm',0,1],['farm',0,.5]],eq:SEAT,P:p=>{const g=D*(88-150*p);return{h:[30,58],s:[32,34],a:[33+14*C(g),48+14*Sn(g)],f:[48,80]}}},
  triceps:{k:-1,e:1,hl:[['uarm',0,1]],eq:'',P:p=>{const g=D*90*(1+p);return{h:[40,56],s:[60,40],a:[47+14*C(g),42+14*Sn(g)],f:[40,84]}}},
  side_bend:{k:-1,e:-1,db:1,hl:[['torso',.05,.6]],eq:'',P:p=>{const a=D*(-3+27*p),sx=60+24*Sn(a),sy=40-24*C(a);return{h:[60,40],s:[sx,sy],a:[sx+5,sy+26],f:[60,79]}}},
  bridge:{k:-1,e:-1,hl:[['thigh',0,.6],['torso',0,.2]],eq:'',P:p=>{const g=-28*D*p;return{h:[22+24*C(g),73+24*Sn(g)],s:[22,73],a:[46,75],f:[64,76]}}}
};
function ik(a,b,l1,l2,k){
  const dx=b[0]-a[0],dy=b[1]-a[1],d=Math.min(Math.hypot(dx,dy),l1+l2-.01)||.01,ux=dx/d,uy=dy/d;
  const x=(l1*l1-l2*l2+d*d)/(2*d),h=Math.sqrt(Math.max(0,l1*l1-x*x));
  return[a[0]+ux*x-uy*h*k,a[1]+uy*x+ux*h*k];
}
function figSVG(type){
  const d=E[type]||E.chest_push;
  return `<svg viewBox="0 0 120 90" class="fig" data-t="${E[type]?type:'chest_push'}"><line x1="4" y1="78" x2="116" y2="78" stroke="#1b2234" stroke-width="2"/>${d.eq}
  <g stroke-linecap="round" fill="none"><line class="th" stroke="#64748b" stroke-width="7"/><line class="sh" stroke="#7c8aa0" stroke-width="5.5"/><line class="to" stroke="#64748b" stroke-width="9"/><line class="ua" stroke="#94a3b8" stroke-width="5"/><line class="fa" stroke="#aab6c7" stroke-width="4.5"/>
  <line class="hl" stroke-width="11"/><line class="hl" stroke-width="11"/></g><circle class="hd" r="6.5" fill="#cbd5e1"/><circle class="ha" r="${d.db?4.4:2.6}" fill="${d.db?'#f59e0b':'#22c55e'}"/></svg>`;
}
let figs=[];
function collect(){figs=[...document.querySelectorAll("svg.fig")].map(s=>({s,d:E[s.dataset.t],q:c=>s.querySelector("."+c),hl:s.querySelectorAll(".hl")}))}
function L(el,a,b){el.setAttribute("x1",a[0]);el.setAttribute("y1",a[1]);el.setAttribute("x2",b[0]);el.setAttribute("y2",b[1])}
const lerp=(a,b,f)=>[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f];
function frame(ms){
  const t=ms/1000,p=.5-.5*C(t*2.1);
  figs.forEach(f=>{
    const o=f.d.P(p,t),K=ik(o.h,o.f,20,20,f.d.k),El=ik(o.s,o.a,14,14,f.d.e);
    const G={torso:[o.h,o.s],thigh:[o.h,K],shin:[K,o.f],uarm:[o.s,El],farm:[El,o.a]};
    L(f.q("to"),...G.torso);L(f.q("th"),...G.thigh);L(f.q("sh"),...G.shin);L(f.q("ua"),...G.uarm);L(f.q("fa"),...G.farm);
    const vx=o.s[0]-o.h[0],vy=o.s[1]-o.h[1],n=Math.hypot(vx,vy)||1,hd=f.q("hd");
    hd.setAttribute("cx",o.s[0]+vx/n*9);hd.setAttribute("cy",o.s[1]+vy/n*9);
    const ha=f.q("ha");ha.setAttribute("cx",o.a[0]);ha.setAttribute("cy",o.a[1]);
    f.hl.forEach((el,i)=>{const m=f.d.hl[i];if(!m){el.style.display="none";return}const[a,b]=G[m[0]];L(el,lerp(a,b,m[1]),lerp(a,b,m[2]))});
  });
  requestAnimationFrame(frame);
}

/* ===== Séance ===== */
let prog=getProg();
const rest=e=>e.restSec!==undefined?e.restSec:90;
function save(){saveProg(prog)}

function render(){
  const pill=(i,v,cur)=>`<button onclick="setRest(${i},${v})" class="pill${cur===v?" on":""}">${v}s</button>`;
  $("list").innerHTML=prog.exercises.map((ex,i)=>{
    const cur=rest(ex);
    const sets=ex.sets.map((s,j)=>`
      <div class="set">
        <span class="num">#${j+1}</span>
        <div><input type="number" step="0.5" value="${s.weight}" onchange="upd(${i},${j},'weight',this.value)" class="inp"><small>kg</small></div>
        <div><input type="number" value="${s.reps}" onchange="upd(${i},${j},'reps',this.value)" class="inp"><small>${esc(s.unit||"reps")}</small></div>
        <div class="acts">
          ${s.unit==="sec"?`<button onclick="exTimer(${s.reps},${i},${j})" class="tm">⏱ ${s.reps}s</button>`:""}
          <button onclick="done(${i},${j})" class="chk${s.done?" on":""}">✓</button>
        </div>
      </div>`).join("");
    return `<div class="card">
      <div class="exh">${figSVG(ex.animType)}
        <div style="min-width:0"><h3>${esc(ex.name)}</h3><p class="m">${esc(ex.muscle)}</p><p class="n">${esc(ex.note)}</p></div></div>
      <div class="rest"><span>Pause après série :</span><div>${pill(i,60,cur)}${pill(i,90,cur)}${pill(i,0,cur)}</div></div>
      <div>${sets}</div></div>`}).join("");
  collect();refreshHeader();
}
function setRest(i,s){prog.exercises[i].restSec=s;save();render()}
function upd(i,j,f,v){prog.exercises[i].sets[j][f]=parseFloat(v)||0;save()}
function done(i,j){
  const s=prog.exercises[i].sets[j];
  s.done=!s.done;save();render();
  if(s.done&&rest(prog.exercises[i])>0)timer(rest(prog.exercises[i]),"Repos",true);
}
function exTimer(sec,i,j){
  timer(sec,"Exercice",false,()=>{
    prog.exercises[i].sets[j].done=true;save();render();
    const r=rest(prog.exercises[i]);
    if(r>0)timer(r,"Repos",false); // pas de tap ici : iOS refuserait le raccourci
  });
}
function finish(){
  const m=$("fm");
  if(!prog.exercises.some(e=>e.sets.some(s=>s.done))){alert("Coche au moins une série avant de terminer.");return}
  if(!confirm("Enregistrer la séance dans l'historique et remettre les séries à zéro ?"))return;
  const note=(prompt("Une note pour cette séance ? (facultatif)")||"").trim();
  addHist(sessionFromProg(prog,note));
  prog.exercises.forEach(e=>e.sets.forEach(s=>s.done=false));
  save();render();stopT();
  m.innerText="Séance enregistrée dans l'historique (onglet Stats).";m.style.display="block";
  setTimeout(()=>m.style.display="none",4000);
}

mountShell("index.html");
$("bw").value=getBW();
render();
requestAnimationFrame(frame);
</script>
</body>
</html>
