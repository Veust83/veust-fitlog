<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Veust FitLog</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root{color-scheme:dark}
body{background:#050811;color:#f1f5f9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:7rem}
.fig{width:7.5rem;height:5.6rem;background:#080c18;border:1px solid #1b2234;border-radius:.6rem;flex-shrink:0}
.hl{stroke:#ef4444;fill:none;stroke-linecap:round;animation:pm 1.5s infinite ease-in-out}
@keyframes pm{0%,100%{opacity:.3}50%{opacity:.95}}
.card{background:#0f1422;border:1px solid #1b2234;border-radius:.75rem}
.inp{background:#080c18;border:1px solid #1b2234;border-radius:.4rem;text-align:center;font-weight:700;font-size:.75rem;width:100%;padding:.25rem}
</style>
</head>
<body>
<header class="fixed top-0 left-0 right-0 z-50 bg-[#050811]/95 backdrop-blur border-b border-[#1b2234]" style="padding-top:env(safe-area-inset-top,0px)">
  <div class="px-4 py-2 max-w-md mx-auto flex justify-between items-center">
    <div><h1 class="text-sm font-bold text-[#22c55e]">VEUST FITLOG</h1><p class="text-[11px] text-slate-400" id="ttl"></p></div>
    <div class="text-right"><span class="text-[9px] text-slate-400 uppercase block">Tonnage</span><span class="text-sm font-bold" id="vol">0 kg</span></div>
  </div>
  <div class="bg-[#0b0f1a] border-t border-[#1b2234] px-4 py-2 max-w-md mx-auto flex items-center justify-between">
    <div class="flex items-center gap-2"><span id="tl" class="text-[11px] font-semibold text-slate-400 uppercase">Chrono :</span><span id="td" class="font-mono text-base font-bold text-[#22c55e]">01:30</span></div>
    <div class="flex gap-1.5">
      <button onclick="timer(60,'Repos',true)" class="px-2 py-0.5 bg-[#141b2d] border border-[#1b2234] rounded text-[11px]">60s</button>
      <button onclick="timer(90,'Repos',true)" class="px-2 py-0.5 bg-[#22c55e] text-slate-950 rounded text-[11px] font-bold">90s</button>
      <button onclick="stopT()" class="px-2 py-0.5 bg-rose-950/70 border border-rose-900/60 text-rose-300 rounded text-[11px]">Stop</button>
    </div>
  </div>
</header>
<div style="height:calc(6rem + env(safe-area-inset-top,0px))"></div>

<main class="p-3.5 max-w-md mx-auto">
  <div id="tab-w" class="space-y-3.5">
    <div class="card p-3 flex items-center justify-between">
      <label class="text-xs text-slate-300">Poids du jour (kg) :</label>
      <input type="number" step="0.1" id="bw" value="109.5" class="w-24 bg-[#080c18] border border-[#1b2234] rounded-lg px-2 py-1 text-right font-bold text-[#22c55e] text-sm">
    </div>
    <div id="list" class="space-y-3.5"></div>
  </div>
  <div id="tab-s" class="hidden space-y-4">
    <div class="card p-4 space-y-3">
      <h2 class="font-bold text-[#22c55e] text-xs uppercase">1. Exporter pour Gemini</h2>
      <button onclick="copyMd()" class="w-full py-2.5 bg-[#22c55e] text-slate-950 rounded-lg font-bold text-xs uppercase">Copier le résumé Markdown</button>
      <p id="cf" class="text-xs text-center text-[#22c55e] hidden">Copié !</p>
    </div>
    <div class="card p-4 space-y-3">
      <h2 class="font-bold text-[#fb923c] text-xs uppercase">2. Importer le JSON Gemini</h2>
      <p class="text-[10px] text-slate-400">animType possibles : bike, plank, leg_ext, leg_curl, chest_push, row_pull, lat_pull, shoulder, curl, triceps, bridge</p>
      <textarea id="jb" rows="5" class="w-full bg-[#080c18] border border-[#1b2234] rounded-lg p-2 text-xs font-mono" placeholder="Colle le JSON ici..."></textarea>
      <button onclick="imp()" class="w-full py-2.5 bg-[#fb923c] text-slate-950 rounded-lg font-bold text-xs uppercase">Charger le programme</button>
      <p id="if" class="text-xs text-center hidden"></p>
    </div>
    <button onclick="resetP()" class="w-full py-2 border border-[#1b2234] text-slate-400 rounded-lg text-xs">Recharger le programme par défaut</button>
  </div>
</main>

<nav class="fixed bottom-0 left-0 right-0 bg-[#050811]/95 border-t border-[#1b2234] flex justify-around p-3 z-40 max-w-md mx-auto backdrop-blur" style="padding-bottom:calc(.75rem + env(safe-area-inset-bottom,0px))">
  <button onclick="tab('w')" id="nw" class="text-[#22c55e] font-bold text-xs flex flex-col items-center gap-1"><span class="text-base">🏋️‍♂️</span>Séance</button>
  <button onclick="tab('s')" id="ns" class="text-slate-400 text-xs flex flex-col items-center gap-1"><span class="text-base">🔄</span>Sync Gemini</button>
  <a href="stats.html" class="text-slate-400 text-xs flex flex-col items-center gap-1"><span class="text-base">📊</span>Stats</a>
</nav>

<script>
const D=Math.PI/180,C=Math.cos,Sn=Math.sin;
const SEAT='<rect x="22" y="61" width="30" height="4" rx="2" fill="#334155"/><rect x="19" y="24" width="5" height="40" rx="2" fill="#334155"/>';
const E={
  bike:{k:-1,e:1,hl:[['thigh',0,1]],eq:'<circle cx="52" cy="68" r="9" stroke="#334155" fill="none"/><rect x="31" y="56" width="14" height="3" rx="1" fill="#334155"/><line x1="72" y1="40" x2="72" y2="68" stroke="#334155" stroke-width="2"/>',P:(p,t)=>({h:[40,52],s:[56,32],a:[72,40],f:[52+9*C(t*5),68+9*Sn(t*5)]})},
  plank:{k:-1,e:1,hl:[['torso',.05,.6]],eq:'',P:p=>({h:[59,58+1.5*p],s:[35,56],a:[49,70],f:[95,73]})},
  leg_ext:{k:-1,e:1,hl:[['thigh',0,1]],eq:SEAT,P:p=>{const g=D*90*(1-p);return{h:[35,57],s:[34,33],a:[48,52],f:[55+20*C(g),57+20*Sn(g)]}}},
  leg_curl:{k:-1,e:1,hl:[['thigh',.1,1]],eq:SEAT,P:p=>{const g=D*(15+85*p);return{h:[35,57],s:[34,33],a:[48,52],f:[55+20*C(g),57+20*Sn(g)]}}},
  chest_push:{k:-1,e:1,hl:[['torso',.55,.95],['uarm',0,.5]],eq:SEAT,P:p=>({h:[30,58],s:[32,34],a:[40+30*p,38],f:[48,80]})},
  row_pull:{k:-1,e:1,hl:[['torso',.45,1]],eq:SEAT,P:p=>({h:[30,58],s:[32-3*p,34],a:[74-22*p,41],f:[48,80]})},
  lat_pull:{k:-1,e:1,hl:[['uarm',0,1],['torso',.5,1]],eq:SEAT+'<rect x="36" y="52" width="16" height="3" rx="1" fill="#475569"/>',P:p=>({h:[38,60],s:[40,36],a:[52+4*p,12+18*p],f:[52,82]})},
  shoulder:{k:-1,e:1,hl:[['uarm',0,.6],['torso',.8,1]],eq:SEAT,P:p=>({h:[30,58],s:[32,34],a:[44,30-22*p],f:[48,80]})},
  curl:{k:-1,e:1,hl:[['uarm',0,1]],eq:SEAT+'<line x1="36" y1="40" x2="48" y2="54" stroke="#475569" stroke-width="5" stroke-linecap="round"/>',P:p=>{const g=D*(20-120*p);return{h:[30,60],s:[34,36],a:[43+14*C(g),47+14*Sn(g)],f:[48,82]}}},
  triceps:{k:-1,e:1,hl:[['uarm',0,1]],eq:'',P:p=>{const g=D*90*(1+p);return{h:[40,56],s:[60,40],a:[47+14*C(g),42+14*Sn(g)],f:[40,84]}}},
  bridge:{k:-1,e:-1,hl:[['thigh',0,.6],['torso',0,.2]],eq:'',P:p=>{const g=-28*D*p;return{h:[22+24*C(g),73+24*Sn(g)],s:[22,73],a:[46,75],f:[64,76]}}}
};

function ik(a,b,l1,l2,k){
  const dx=b[0]-a[0],dy=b[1]-a[1],d=Math.min(Math.hypot(dx,dy),l1+l2-.01)||.01,ux=dx/d,uy=dy/d;
  const x=(l1*l1-l2*l2+d*d)/(2*d),h=Math.sqrt(Math.max(0,l1*l1-x*x));
  return[a[0]+ux*x-uy*h*k,a[1]+uy*x+ux*h*k];
}

function figSVG(type){
  const d=E[type]||E.chest_push;
  return `<svg viewBox="0 0 120 90" class="fig" data-t="${E[type]?type:'chest_push'}"><line x1="4" y1="78" x2="116" y2="78" stroke="#1b2234" stroke-width="2"/>${d.eq}
  <g stroke-linecap="round" fill="none"><line class="th" stroke="#64748b" stroke-width="7"/><line class="sh" stroke="#7c8aa0" stroke-width="5.5"/><line class="to" stroke="#64748b" stroke-width="9"/><line class="ua" stroke="#94a3b8" stroke-width="5"/><line class="fa" stroke="#aab6c7" stroke-width="4.5"/>
  <line class="hl" stroke-width="11"/><line class="hl" stroke-width="11"/></g><circle class="hd" r="6.5" fill="#cbd5e1"/><circle class="ha" r="2.6" fill="#22c55e"/></svg>`;
}

let figs=[];
function collect(){
  figs=[...document.querySelectorAll('svg.fig')].map(s=>({s,d:E[s.dataset.t],q:c=>s.querySelector('.'+c),hl:s.querySelectorAll('.hl')}));
}
function L(el,a,b){el.setAttribute('x1',a[0]);el.setAttribute('y1',a[1]);el.setAttribute('x2',b[0]);el.setAttribute('y2',b[1]);}
const lerp=(a,b,f)=>[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f];

function frame(ms){
  const t=ms/1000,p=.5-.5*C(t*2.1);
  figs.forEach(f=>{
    const o=f.d.P(p,t),K=ik(o.h,o.f,20,20,f.d.k),El=ik(o.s,o.a,14,14,f.d.e);
    const S={torso:[o.h,o.s],thigh:[o.h,K],shin:[K,o.f],uarm:[o.s,El],farm:[El,o.a]};
    L(f.q('to'),...S.torso);L(f.q('th'),...S.thigh);L(f.q('sh'),...S.shin);L(f.q('ua'),...S.uarm);L(f.q('fa'),...S.farm);
    const vx=o.s[0]-o.h[0],vy=o.s[1]-o.h[1],n=Math.hypot(vx,vy)||1,hd=f.q('hd');
    hd.setAttribute('cx',o.s[0]+vx/n*9);hd.setAttribute('cy',o.s[1]+vy/n*9);
    const ha=f.q('ha');ha.setAttribute('cx',o.a[0]);ha.setAttribute('cy',o.a[1]);
    f.hl.forEach((el,i)=>{const m=f.d.hl[i];if(!m){el.style.display='none';return}const[a,b]=S[m[0]];L(el,lerp(a,b,m[1]),lerp(a,b,m[2]));});
  });
  requestAnimationFrame(frame);
}

const S=(n,w,r,u='reps')=>Array.from({length:n},(_,i)=>{const R=[].concat(r);return{weight:w,reps:R[i]??R[0],unit:u,done:false}});
const X=(name,muscle,animType,restSec,note,sets)=>({name,muscle,animType,restSec,note,sets});
const defaultWorkout=()=>({title:"Tour du Monde #4 (3 Séries)",exercises:[
  X("Vélo d'appartement (Échauffement)","Cardio & Mobilité","bike",0,"Pédalage régulier, sans résistance excessive.",S(1,0,12,"min")),
  X("Planche sur les coudes (À frais)","Transverse & Abdominaux profonds","plank",60,"Placée avant les charges pour protéger les épaules.",S(3,0,35,"sec")),
  X("Leg Extension assis","Quadriceps","leg_ext",90,"Contrôle la descente, dos plaqué au fond du siège.",S(3,30,12)),
  X("Leg Curl assis","Ischio-jambiers","leg_curl",90,"Bassin bien calé, tire avec l'arrière des cuisses.",S(3,30,15)),
  X("Développé poitrine machine","Pectoraux","chest_push",90,"Prise neutre, expire en poussant en rentrant le ventre.",S(3,30,[15,15,12])),
  X("Rowing assis (Appui ventral)","Dos (Épaisseur)","row_pull",90,"Poitrine contre le coussin, coudes tirés en arrière.",S(3,30,15)),
  X("Tirage vertical poitrine","Grand Dorsal (Largeur)","lat_pull",90,"Tire vers les clavicules en resserrant les omoplates.",S(3,30,12)),
  X("Développé épaules assis machine","Épaules (Deltoïdes & volume)","shoulder",90,"Prise neutre, 3 secondes de contrôle à la descente.",S(3,15,12)),
  X("Curl au pupitre","Biceps","curl",60,"Bras verrouillés sur le pupitre, isolation stricte.",S(3,10,[10,10,8])),
  X("Kickback Triceps ou Extension 1 bras","Triceps","triceps",60,"Coudes fixes le long du buste, extension nette.",S(3,5,15)),
  X("Pont fessier avec serrage adducteurs","Fessiers & Plancher pelvien","bridge",60,"Serre le bloc entre les genoux 1 sec en haut.",S(3,0,12))
]});

const KEY="veust_active_program_v6";
let prog=defaultWorkout(),ti=null,tEnd=0;

function save(){try{localStorage.setItem(KEY,JSON.stringify(prog))}catch(e){}vol()}
function vol(){
  let t=0;
  prog.exercises.forEach(e=>e.sets.forEach(s=>{if(s.done&&s.unit!=="sec"&&s.unit!=="min")t+=(+s.weight||0)*(+s.reps||0)}));
  document.getElementById("vol").innerText=t.toLocaleString("fr-CH")+" kg";
  return t;
}
const rest=e=>e.restSec!==undefined?e.restSec:90;
function setRest(i,s){prog.exercises[i].restSec=s;save();render()}

function render(){
  document.getElementById("ttl").innerText=prog.title;
  const rb=(i,v,cur)=>`<button onclick="setRest(${i},${v})" class="px-2 py-0.5 text-[10px] rounded font-bold ${cur===v?'bg-[#22c55e] text-slate-950':'bg-[#141b2d] border border-[#1b2234] text-slate-300'}">${v}s</button>`;
  document.getElementById("list").innerHTML=prog.exercises.map((ex,i)=>{
    const cur=rest(ex);
    const sets=ex.sets.map((s,j)=>`
      <div class="grid grid-cols-12 gap-1.5 items-center py-1.5 border-t border-[#1b2234]">
        <span class="col-span-2 text-xs font-bold text-slate-400">#${j+1}</span>
        <div class="col-span-3"><input type="number" step="0.5" value="${s.weight}" onchange="upd(${i},${j},'weight',this.value)" class="inp"><span class="text-[9px] text-slate-400 block text-center">kg</span></div>
        <div class="col-span-3"><input type="number" value="${s.reps}" onchange="upd(${i},${j},'reps',this.value)" class="inp"><span class="text-[9px] text-slate-400 block text-center">${s.unit||'reps'}</span></div>
        <div class="col-span-4 flex justify-end gap-1 items-center">
          ${s.unit==="sec"?`<button onclick="exTimer(${s.reps},${i},${j})" class="px-2 py-1 bg-[#fb923c]/20 border border-[#fb923c]/50 text-[#fb923c] rounded text-[11px] font-bold">⏱ ${s.reps}s</button>`:''}
          <button onclick="done(${i},${j})" class="w-8 h-8 rounded-lg font-bold ${s.done?'bg-[#22c55e] text-slate-950':'bg-[#141b2d] border border-[#1b2234] text-slate-400'}">✓</button>
        </div>
      </div>`).join("");
    return `<div class="card p-3 space-y-2.5">
      <div class="flex gap-2.5 items-center">${figSVG(ex.animType)}
        <div class="flex-1 min-w-0"><h3 class="font-bold text-sm leading-tight">${ex.name}</h3><p class="text-[11px] text-[#22c55e] font-semibold">${ex.muscle||''}</p><p class="text-[10px] text-slate-300 mt-0.5">${ex.note||''}</p></div></div>
      <div class="flex items-center justify-between bg-[#080c18] border border-[#1b2234] rounded-lg px-2 py-1"><span class="text-[10px] text-slate-400 uppercase font-semibold">Pause après série :</span><div class="flex gap-1">${rb(i,60,cur)}${rb(i,90,cur)}${rb(i,0,cur)}</div></div>
      <div>${sets}</div></div>`}).join("");
  collect();vol();
}

function upd(i,j,f,v){prog.exercises[i].sets[j][f]=parseFloat(v)||0;save()}
function done(i,j){const s=prog.exercises[i].sets[j];s.done=!s.done;save();render();if(s.done && rest(prog.exercises[i])>0)timer(rest(prog.exercises[i]),"Repos",true)}
function exTimer(sec,i,j){timer(sec,"Exercice",false,()=>{prog.exercises[i].sets[j].done=true;save();render();const r=rest(prog.exercises[i]);if(r>0)timer(r,"Repos",true)})}

function triggerShortcut(sec){try{window.location.href="shortcuts://run-shortcut?name=Pause90&input=text&text="+encodeURIComponent(sec)}catch(e){}}
function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.2;o.start();o.stop(c.currentTime+.35)}catch(e){}}
function timer(sec,label,runIOS,cb){
  clearInterval(ti);tEnd=Date.now()+sec*1000;
  const d=document.getElementById("td"),l=document.getElementById("tl"),ex=label==="Exercice";
  l.innerText=label+" :";l.className="text-[11px] font-semibold uppercase "+(ex?"text-[#fb923c]":"text-slate-400");
  d.className="font-mono text-base font-bold "+(ex?"text-[#fb923c]":"text-[#22c55e]");
  const tick=()=>{const r=Math.max(0,Math.ceil((tEnd-Date.now())/1000));d.innerText=String(Math.floor(r/60)).padStart(2,"0")+":"+String(r%60).padStart(2,"0");if(r<=0){clearInterval(ti);tEnd=0;d.innerText="FINI !";beep();cb&&cb()}};
  tick();ti=setInterval(tick,250);
  if(runIOS) setTimeout(()=>triggerShortcut(sec),120);
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden && tEnd>0){const r=Math.max(0,Math.ceil((tEnd-Date.now())/1000)),d=document.getElementById("td");if(r<=0){clearInterval(ti);tEnd=0;d.innerText="FINI !"}else d.innerText=String(Math.floor(r/60)).padStart(2,"0")+":"+String(r%60).padStart(2,"0")}});
function stopT(){clearInterval(ti);tEnd=0;document.getElementById("tl").innerText="Chrono :";document.getElementById("td").innerText="01:30"}

function tab(t){
  document.getElementById("tab-w").classList.toggle("hidden",t!=="w");
  document.getElementById("tab-s").classList.toggle("hidden",t!=="s");
  document.getElementById("nw").className=(t==="w"?"text-[#22c55e] font-bold":"text-slate-400")+" text-xs flex flex-col items-center gap-1";
  document.getElementById("ns").className=(t==="s"?"text-[#22c55e] font-bold":"text-slate-400")+" text-xs flex flex-col items-center gap-1";
}
function copyMd(){
  let md=`### Bilan Séance du ${new Date().toLocaleDateString("fr-CH")} - ${prog.title}\n- **Poids :** ${document.getElementById("bw").value} kg\n- **Volume total :** ${vol()} kg\n\n`;
  prog.exercises.forEach(ex=>{const d=ex.sets.filter(s=>s.done);if(d.length)md+=`- **${ex.name}** : ${d.length} séries (${d.map(s=>`${s.reps}${s.unit==='sec'?'s':s.unit==='min'?'min':''} @${s.weight}kg`).join(", ")})\n`});
  try{navigator.clipboard.writeText(md)}catch(e){}
  const f=document.getElementById("cf");f.classList.remove("hidden");setTimeout(()=>f.classList.add("hidden"),3000);
}
function imp(){
  const f=document.getElementById("if");
  try{
    const raw=document.getElementById("jb").value.trim().replace(/^```json/i,"").replace(/^```/,"").replace(/```$/,"").trim(),p=JSON.parse(raw);
    if(!Array.isArray(p.exercises))throw 0;
    prog={title:p.title||p.name||"Séance personnalisée",exercises:p.exercises.map(e=>({name:e.name,muscle:e.muscle||"",animType:e.animType||"chest_push",restSec:e.restSec!==undefined?e.restSec:90,note:e.note||e.notes||"",sets:(e.sets||[]).map(s=>({weight:parseFloat(s.weight)||0,reps:parseInt(s.reps)||12,unit:s.unit||"reps",done:Boolean(s.done||s.completed)}))}))};
    save();render();tab("w");
  }catch(e){f.innerText="Erreur : format JSON non valide.";f.className="text-xs text-center text-rose-400 block"}
}
function resetP(){prog=defaultWorkout();save();render();tab("w")}
try{const s=localStorage.getItem(KEY);if(s)prog=JSON.parse(s)}catch(e){}
if(location.hash==="#sync")tab("s");
render();requestAnimationFrame(frame);
</script>
</body>
</html>
