<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Veust FitLog</title>
<link rel="stylesheet" href="style.css">

  html,body{background:#050811;color:#f1f5f9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
</style>
</head>
<body>
<main id="app-main"></main>

<script src="common.js"></script>
<script>
/* ===== Chrono global de la séance (expire après 12 h si on oublie de terminer) ===== */
const SK="veust_session_start";
let sessStart=parseInt(lsGet(SK,"0"))||0;
if(sessStart&&Date.now()-sessStart>12*3600*1000){sessStart=0;lsDel(SK)}

function startSessionClock(){
  if(!sessStart){
    sessStart=Date.now();
    lsSet(SK,String(sessStart));
  }
}
function clearSessionClock(){
  sessStart=0;
  lsDel(SK);
  const el=$("sess-dur");
  if(el) el.remove();
}
function fmtSessionDur(ms){
  const totSec=Math.max(0,Math.floor(ms/1000));
  const h=Math.floor(totSec/3600);
  const m=Math.floor((totSec%3600)/60);
  const s=totSec%60;
  if(h>0) return `${h}h ${String(m).padStart(2,"0")}m`;
  return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}
function updateSessionClock(){
  const volEl=$("vol");
  if(!volEl) return;
  let badge=$("sess-dur");
  if(!sessStart){
    if(badge) badge.remove();
    return;
  }
  if(!badge){
    badge=document.createElement("span");
    badge.id="sess-dur";
    badge.style.cssText="font-size:10px;color:#14b8a6;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;display:block;text-align:right;font-weight:700;margin-top:1px";
    volEl.parentElement.appendChild(badge);
  }
  badge.innerText="⏱ "+fmtSessionDur(Date.now()-sessStart);
}

/* ===== Moteur d'animation SVG 3D =====
   Corrections : définitions (dégradés/filtres) créées UNE seule fois, dégradés et filtres en
   userSpaceOnUse (un trait parfaitement horizontal/vertical a une boîte de taille nulle et
   disparaissait avec objectBoundingBox), filtres lourds uniquement sur la grande figure. */
const D=Math.PI/180,C=Math.cos,Sn=Math.sin;
const SEAT='<rect x="20" y="61" width="32" height="5" rx="2.5" fill="url(#gEq)"/><rect x="17" y="22" width="6" height="42" rx="3" fill="url(#gEq)"/>';
const E={
  bike:{k:-1,e:1,hl:[['thigh',0,1]],eq:'<circle cx="52" cy="68" r="9.5" stroke="url(#gEq)" stroke-width="2.5" fill="none"/><rect x="30" y="55" width="15" height="4" rx="2" fill="url(#gEq)"/><line x1="72" y1="38" x2="72" y2="68" stroke="url(#gEq)" stroke-width="3"/>',P:(p,t)=>({h:[40,52],s:[56,32],a:[72,40],f:[52+9*C(t*5),68+9*Sn(t*5)]})},
  plank:{k:-1,e:1,hl:[['torso',.05,.65]],eq:'',P:p=>({h:[59,58+1.5*p],s:[35,56],a:[49,70],f:[95,73]})},
  leg_ext:{k:-1,e:1,hl:[['thigh',0,1]],eq:SEAT,P:p=>{const g=D*90*(1-p);return{h:[35,57],s:[34,33],a:[48,52],f:[55+20*C(g),57+20*Sn(g)]}}},
  leg_curl:{k:-1,e:1,hl:[['thigh',.1,1]],eq:SEAT,P:p=>{const g=D*(15+85*p);return{h:[35,57],s:[34,33],a:[48,52],f:[55+20*C(g),57+20*Sn(g)]}}},
  chest_push:{k:-1,e:1,hl:[['torso',.5,.95],['uarm',0,.55]],eq:SEAT,P:p=>({h:[30,58],s:[32,34],a:[40+30*p,38],f:[48,80]})},
  row_pull:{k:-1,e:1,hl:[['torso',.45,1]],eq:SEAT,P:p=>({h:[30,58],s:[32-3*p,34],a:[74-22*p,41],f:[48,80]})},
  lat_pull:{k:-1,e:1,hl:[['uarm',0,1],['torso',.5,1]],eq:SEAT+'<rect x="36" y="52" width="16" height="3.5" rx="1.5" fill="url(#gEq)"/>',P:p=>({h:[38,60],s:[40,36],a:[52+4*p,12+18*p],f:[52,82]})},
  shoulder:{k:-1,e:1,hl:[['uarm',0,.65],['torso',.75,1]],eq:SEAT,P:p=>({h:[30,58],s:[32,34],a:[44,30-22*p],f:[48,80]})},
  shrug:{k:-1,e:-1,db:1,hl:[['torso',.75,1],['uarm',0,.4]],eq:SEAT,P:p=>{const q=Math.min(1,p*1.5),sy=34-6*q;return{h:[30,58],s:[32,sy],a:[34,sy+27],f:[48,80]}}},
  curl:{k:-1,e:1,hl:[['uarm',0,1]],eq:SEAT+'<line x1="36" y1="40" x2="48" y2="54" stroke="url(#gEq)" stroke-width="5.5" stroke-linecap="round"/>',P:p=>{const g=D*(20-120*p);return{h:[30,60],s:[34,36],a:[43+14*C(g),47+14*Sn(g)],f:[48,82]}}},
  incline_curl:{k:-1,e:1,db:1,hl:[['uarm',0,1],['farm',0,.4]],eq:'<line x1="28" y1="66" x2="10" y2="36" stroke="url(#gEq)" stroke-width="7" stroke-linecap="round"/><rect x="24" y="64" width="20" height="4.5" rx="2" fill="url(#gEq)"/>',P:p=>{const g=D*(85-155*p);return{h:[34,62],s:[22,41],a:[24+14*C(g),55+14*Sn(g)],f:[56,80]}}},
  hammer:{k:-1,e:1,db:1,hl:[['uarm',0,1],['farm',0,.5]],eq:SEAT,P:p=>{const g=D*(88-150*p);return{h:[30,58],s:[32,34],a:[33+14*C(g),48+14*Sn(g)],f:[48,80]}}},
  triceps:{k:-1,e:1,hl:[['uarm',0,1]],eq:'',P:p=>{const g=D*90*(1+p);return{h:[40,56],s:[60,40],a:[47+14*C(g),42+14*Sn(g)],f:[40,84]}}},
  side_bend:{k:-1,e:-1,db:1,hl:[['torso',.05,.65]],eq:'',P:p=>{const a=D*(-3+27*p),sx=60+24*Sn(a),sy=40-24*C(a);return{h:[60,40],s:[sx,sy],a:[sx+5,sy+26],f:[60,79]}}},
  bridge:{k:-1,e:-1,hl:[['thigh',0,.65],['torso',0,.25]],eq:'',P:p=>{const g=-28*D*p;return{h:[22+24*C(g),73+24*Sn(g)],s:[22,73],a:[46,75],f:[64,76]}}}
};

const SVG_DEFS=`<defs>
  <linearGradient id="gBody" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="90">
    <stop offset="0" stop-color="#e2e8f0"/><stop offset="1" stop-color="#475569"/>
  </linearGradient>
  <linearGradient id="gLimb" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="90">
    <stop offset="0" stop-color="#e2e8f0"/><stop offset="1" stop-color="#64748b"/>
  </linearGradient>
  <linearGradient id="gEq" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="90">
    <stop offset="0" stop-color="#64748b"/><stop offset="1" stop-color="#1e293b"/>
  </linearGradient>
  <linearGradient id="gMuscle" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="90">
    <stop offset="0" stop-color="#fb923c"/><stop offset="1" stop-color="#dc2626"/>
  </linearGradient>
  <radialGradient id="gHead" cx="0.35" cy="0.3" r="0.65">
    <stop offset="0" stop-color="#f8fafc"/><stop offset="0.55" stop-color="#94a3b8"/><stop offset="1" stop-color="#1e293b"/>
  </radialGradient>
  <filter id="glow3d" filterUnits="userSpaceOnUse" x="0" y="0" width="120" height="90">
    <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="b"/>
    <feOffset in="b" dy="2" result="o"/>
    <feComponentTransfer in="o" result="s"><feFuncA type="linear" slope="0.7"/></feComponentTransfer>
    <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="mGlow" filterUnits="userSpaceOnUse" x="0" y="0" width="120" height="90">
    <feGaussianBlur stdDeviation="2.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>`;
document.body.insertAdjacentHTML("afterbegin",`<svg width="0" height="0" style="position:absolute" aria-hidden="true">${SVG_DEFS}</svg>`);

function ik(a,b,l1,l2,k){
  const dx=b[0]-a[0],dy=b[1]-a[1],d=Math.min(Math.hypot(dx,dy),l1+l2-.01)||.01,ux=dx/d,uy=dy/d;
  const x=(l1*l1-l2*l2+d*d)/(2*d),h=Math.sqrt(Math.max(0,l1*l1-x*x));
  return[a[0]+ux*x-uy*h*k,a[1]+uy*x+ux*h*k];
}
function figSVG(type, big=false){
  const d=E[type]||E.chest_push;
  const fG=big?' filter="url(#glow3d)"':'', fM=big?' filter="url(#mGlow)"':'';
  return `<svg viewBox="0 0 120 90" class="${big?'fig-big':'fig-thumb'}" data-t="${E[type]?type:'chest_push'}">
  <ellipse cx="60" cy="81" rx="44" ry="3.5" fill="rgba(0,0,0,0.6)"/>
  <line x1="8" y1="79" x2="112" y2="79" stroke="#1e293b" stroke-width="1.5"/>${d.eq}
  <g stroke-linecap="round" fill="none"${fG}>
    <line class="th" stroke="url(#gLimb)" stroke-width="8.5"/>
    <line class="sh" stroke="url(#gLimb)" stroke-width="6.5"/>
    <line class="to" stroke="url(#gBody)" stroke-width="11"/>
    <line class="hl" stroke="url(#gMuscle)" stroke-width="11.5"${fM}/>
    <line class="hl" stroke="url(#gMuscle)" stroke-width="10.5"${fM}/>
    <line class="ua" stroke="url(#gLimb)" stroke-width="6"/>
    <line class="fa" stroke="url(#gLimb)" stroke-width="5"/>
  </g>
  <circle class="jt-k" r="3.2" fill="#334155"/><circle class="jt-e" r="2.6" fill="#475569"/>
  <circle class="hd" r="7.2" fill="url(#gHead)"${fG}/>
  <circle class="ha" r="${d.db?4.8:3.2}" fill="${d.db?'#f59e0b':'#14b8a6'}"${fG}/></svg>`;
}
let figs=[];
function collect(){figs=[...document.querySelectorAll("svg[data-t]")].map(s=>({s,d:E[s.dataset.t],q:c=>s.querySelector("."+c),hl:s.querySelectorAll(".hl")}))}
function L(el,a,b){el.setAttribute("x1",a[0]);el.setAttribute("y1",a[1]);el.setAttribute("x2",b[0]);el.setAttribute("y2",b[1])}
const lerp=(a,b,f)=>[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f];
function frame(ms){
  const t=ms/1000,p=.5-.5*C(t*2.1);
  figs.forEach(f=>{
    const o=f.d.P(p,t),K=ik(o.h,o.f,20,20,f.d.k),El=ik(o.s,o.a,14,14,f.d.e);
    const G={torso:[o.h,o.s],thigh:[o.h,K],shin:[K,o.f],uarm:[o.s,El],farm:[El,o.a]};
    L(f.q("to"),...G.torso);L(f.q("th"),...G.thigh);L(f.q("sh"),...G.shin);L(f.q("ua"),...G.uarm);L(f.q("fa"),...G.farm);
    const jk=f.q("jt-k");if(jk){jk.setAttribute("cx",K[0]);jk.setAttribute("cy",K[1])}
    const je=f.q("jt-e");if(je){je.setAttribute("cx",El[0]);je.setAttribute("cy",El[1])}
    const vx=o.s[0]-o.h[0],vy=o.s[1]-o.h[1],n=Math.hypot(vx,vy)||1,hd=f.q("hd");
    hd.setAttribute("cx",o.s[0]+vx/n*9.5);hd.setAttribute("cy",o.s[1]+vy/n*9.5);
    const ha=f.q("ha");ha.setAttribute("cx",o.a[0]);ha.setAttribute("cy",o.a[1]);
    f.hl.forEach((el,i)=>{const m=f.d.hl[i];if(!m){el.style.display="none";return}el.style.display="";const[a,b]=G[m[0]];L(el,lerp(a,b,m[1]),lerp(a,b,m[2]))});
  });
  updateFocusRings();
  updateSessionClock();
  requestAnimationFrame(frame);
}

/* ===== Historique : historique.json + séances archivées sur l'appareil ===== */
let REMOTE=[];
const pdate=s=>{const[d,m,y]=String(s).split(".");return new Date(+y,m-1,+d).getTime()||0};
function allHist(){
  const keys=new Set(REMOTE.map(s=>s.date+"|"+s.title));
  return [...REMOTE,...getHist().filter(s=>!keys.has(s.date+"|"+s.title))].sort((a,b)=>pdate(b.date)-pdate(a.date));
}
async function loadRemoteHist(){
  try{
    const r=await fetch("historique.json?t="+Date.now());
    if(!r.ok)return;
    REMOTE=(await r.json()).sessions||[];
    const ae=document.activeElement;
    if(viewMode==="focus"&&!(ae&&ae.tagName==="INPUT"))render();
  }catch(e){}
}
/* Rapprochement tolérant des noms d'exercices (« Curl incliné assis haltères (Banc 60°) » ~ « Curl incliné haltères (60°) ») */
const STOP=new Set(["aux","avec","de","du","des","la","le","les","au","et","en","d","l"]);
const toks=s=>String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\(.*?\)/g," ").replace(/[^a-z0-9]+/g," ").trim().split(" ").filter(w=>w&&!STOP.has(w));
function sameEx(a,b){
  const A=new Set(toks(a)),B=new Set(toks(b));
  if(!A.size||!B.size)return false;
  let n=0;A.forEach(w=>{if(B.has(w))n++});
  return n/(A.size+B.size-n)>=0.7;
}

/* ===== État de navigation : Vue Liste ("list") vs Vue Focus ("focus") ===== */
let prog=getProg(), viewMode="list", curIdx=0;
let exPhaseMax=0, exPhaseTag="";
const rest=e=>e.restSec!==undefined?e.restSec:90;
function save(){saveProg(prog)}

function fmtSec(s){
  const m=Math.floor(s/60), r=s%60;
  return String(m).padStart(2,"0")+":"+String(r).padStart(2,"0");
}

function isTwoSided(ex){
  if(ex.bilateral) return true;
  const txt=((ex.name||"")+" "+(ex.note||"")).toLowerCase();
  return /c[oô]t[eé]|lat[eé]ral|unilat[eé]ral|bilat[eé]ral|2\s*parties/.test(txt);
}

function fmtExSummary(ex){
  const s=ex.sets||[];
  if(!s.length)return "";
  const two=isTwoSided(ex);
  const u=s[0].unit==="sec"?"s":s[0].unit==="min"?" min":" kg";
  const same=s.every(x=>x.weight===s[0].weight&&x.reps===s[0].reps);
  if(same){
    if(s[0].unit==="sec"||s[0].unit==="min") return `${s.length}x${s[0].reps}${u}${two?" / côté":""}`;
    return `${s.length}x${s[0].reps}x${s[0].weight} kg`;
  }
  return s.map(x=>`${x.reps}x${x.weight} kg`).join(" - ");
}

function getProgPct(){
  let tot=0,dn=0;
  prog.exercises.forEach(e=>e.sets.forEach(s=>{tot++;if(s.done)dn++}));
  return tot?Math.round(dn/tot*100):0;
}

function openFocus(idx){
  curIdx=Math.max(0,Math.min(prog.exercises.length-1,idx));
  viewMode="focus";
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

function startWorkout(){
  startSessionClock();
  const idx=prog.exercises.findIndex(e=>e.sets.some(s=>!s.done));
  openFocus(idx>=0?idx:0);
}

function resetProgress(){
  if(!confirm("Réinitialiser toutes les séries cochées et le chrono de cette séance ?"))return;
  prog.exercises.forEach(e=>e.sets.forEach(s=>{s.done=false;delete s.time}));
  clearSessionClock();
  save();render();
}

function render(){
  if(viewMode==="list") renderList();
  else renderFocus();
  collect();refreshHeader();updateSessionClock();
}

function renderList(){
  const pct=getProgPct();
  const R=22, C_LEN=2*Math.PI*R, dash=C_LEN*(1-pct/100);
  const estMin=Math.max(15, prog.exercises.reduce((a,e)=>a+e.sets.length*2.5,0)|0);
  const h=Math.floor(estMin/60), m=estMin%60;
  const durStr=(h?h+"h ":"")+m+"min";

  const rows=prog.exercises.map((ex,i)=>{
    const dn=ex.sets.filter(s=>s.done).length, tot=ex.sets.length;
    const epct=tot?Math.round(dn/tot*100):0;
    return `<div class="ex-list-item" onclick="openFocus(${i})">
      ${figSVG(ex.animType,false)}
      <div class="ex-list-info">
        <h3>${esc(ex.name)}</h3>
        <p class="ex-list-sub">${esc(fmtExSummary(ex))}</p>
      </div>
      <div class="ex-list-pct ${epct===100?'done':''}">${epct}%</div>
    </div>`;
  }).join("");

  $("app-main").innerHTML=`
    <div class="card row" style="padding:.6rem .75rem">
      <label style="font-size:.75rem;color:#cbd5e1">Poids du jour (kg) :</label>
      <input type="number" step="0.1" id="bw" value="${esc(getBW())}" class="inp bw" oninput="setBW(this.value)">
    </div>

    <div class="prog-banner">
      <div class="ring-sm-wrap">
        <svg width="56" height="56" viewBox="0 0 56 56">
          <circle cx="28" cy="28" r="${R}" stroke="#1e293b" stroke-width="4" fill="none"/>
          <circle cx="28" cy="28" r="${R}" stroke="#14b8a6" stroke-width="4" fill="none" stroke-linecap="round"
            stroke-dasharray="${C_LEN.toFixed(1)}" stroke-dashoffset="${dash.toFixed(1)}" transform="rotate(-90 28 28)"/>
        </svg>
        <span class="ring-sm-txt">${pct}%</span>
      </div>
      <div style="flex:1;min-width:0">
        <div style="display:flex;justify-content:space-between;font-size:11px;color:#94a3b8">
          <span>${sessStart?"Séance en cours":"1 jour d'entraînement"}</span><span>~ ${durStr}</span>
        </div>
        <div style="font-size:1rem;font-weight:700;color:#fff;margin-top:.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(prog.title)}</div>
      </div>
    </div>

    <div class="ex-list-wrap">${rows}</div>

    <div style="display:flex;flex-direction:column;gap:.65rem;margin-top:.5rem">
      <button onclick="resetProgress()" class="btn-reset-prog">RÉINITIALISATION DE LA PROGRESSION</button>
      <button onclick="startWorkout()" class="btn-start-prog">${sessStart?"REPRENDRE L'ENTRAÎNEMENT":"COMMENCER L'ENTRAÎNEMENT"}</button>
      <button onclick="finish()" class="btn-full btn-green" style="margin-top:.25rem">✅ Terminer et archiver la séance</button>
      <p id="fm" class="msg" style="color:#22c55e"></p>
    </div>`;
}

function renderFocus(){
  const ex=prog.exercises[curIdx];
  const tot=ex.sets.length, dn=ex.sets.filter(s=>s.done).length;
  const nextIdx=ex.sets.findIndex(s=>!s.done);
  const activeIdx=nextIdx>=0?nextIdx:tot-1;
  const curSet=ex.sets[activeIdx]||{weight:0,reps:12,unit:"reps"};
  const isTimed=(curSet.unit==="sec"||curSet.unit==="min");
  const two=isTwoSided(ex);
  const R=36, C_LEN=2*Math.PI*R;
  const setDash=C_LEN*(1-(tot?dn/tot:0));
  const allDone=tot>0&&dn>=tot;

  const todaySets=ex.sets.map((s,idx)=>({...s,idx})).filter(s=>s.done).reverse();
  const todayHtml=todaySets.length?`
    <div class="hist-group">
      <div class="hist-date">Aujourd'hui (${new Date().toLocaleDateString("fr-CH")})</div>
      ${todaySets.map(s=>`<div class="hist-row" onclick="uncheckSet(${curIdx},${s.idx})">
        <span class="hist-num">#${s.idx+1}</span>
        <span class="hist-val">${s.unit==="sec"?`${s.reps} sec${two?" ×2":""}`:s.unit==="min"?`${s.reps} min`:`${s.weight} kg × ${s.reps} réps`}</span>
        <span class="hist-time">${esc(s.time||"✓")} ✕</span>
      </div>`).join("")}
    </div>`:"";

  const pastSessions=allHist().filter(h=>(h.exercises||[]).some(x=>sameEx(x.name,ex.name))).slice(0,3);
  const pastHtml=pastSessions.map(h=>{
    const found=h.exercises.find(x=>sameEx(x.name,ex.name));
    const parts=(found.summary||"").split(",").map(s=>s.trim()).filter(Boolean);
    return `<div class="hist-group">
      <div class="hist-date">${esc(h.date)}</div>
      ${parts.map((p,k)=>`<div class="hist-row"><span class="hist-num">#${k+1}</span><span class="hist-val">${esc(p)}</span><span class="hist-time">Archivé</span></div>`).join("")}
    </div>`;
  }).join("");

  const lastEx=curIdx===prog.exercises.length-1;
  const nextBtn=allDone?(lastEx
    ?`<button onclick="finish()" class="btn-start-prog" style="margin-top:.75rem">TERMINER LA SÉANCE ✅</button>`
    :`<button onclick="openFocus(${curIdx+1})" class="btn-start-prog" style="margin-top:.75rem">EXERCICE SUIVANT →</button>`):"";

  $("app-main").innerHTML=`
    <div class="focus-top">
      <button onclick="viewMode='list';render()" class="btn-circle" title="Retour à la liste">←</button>
      <div class="focus-step">${curIdx+1}/${prog.exercises.length} <span style="color:#94a3b8;font-weight:500">${esc((ex.muscle||"").split(/[(&]/)[0].trim())}</span></div>
      <div style="display:flex;gap:.4rem">
        <button onclick="openFocus(${curIdx-1})" class="btn-pill-nav" ${curIdx===0?"disabled":""}>‹</button>
        <button onclick="openFocus(${curIdx+1})" class="btn-pill-nav" ${lastEx?"disabled":""}>›</button>
      </div>
    </div>

    <div class="focus-stage">
      ${figSVG(ex.animType,true)}
    </div>

    <div style="margin-top:.25rem">
      <h2 class="focus-title">${esc(ex.name)}</h2>
      <p class="focus-rec">Poids programmé : <strong>${curSet.weight} kg</strong> • Pause : 
        <button onclick="cycleRest(${curIdx})" class="rest-inline">${rest(ex)}s ↻</button>
      </p>
      ${ex.note?`<p class="focus-note">${esc(ex.note)}</p>`:""}
    </div>

    <div class="rings-grid">
      <div class="ring-col">
        <div class="ring-box" ${isTimed?`onclick="toggleFocusExTimer(${curIdx},${activeIdx})" style="cursor:pointer" title="Toucher pour lancer ou arrêter le chrono de l'exercice"`:""}>
          <svg width="86" height="86" viewBox="0 0 86 86">
            <circle cx="43" cy="43" r="${R}" stroke="${isTimed?'#3d220d':'#11343b'}" stroke-width="5" fill="none"/>
            <circle id="focus-ex-arc" cx="43" cy="43" r="${R}" stroke="${isTimed?'#fb923c':'#14b8a6'}" stroke-width="5" fill="none" stroke-linecap="round"
              stroke-dasharray="${C_LEN.toFixed(1)}" stroke-dashoffset="0" transform="rotate(-90 43 43)"/>
          </svg>
          <span class="ring-big-txt" id="focus-ex-txt" style="font-size:${isTimed?(two?'.8rem':'.95rem'):'1.1rem'};font-family:${isTimed?'ui-monospace,SFMono-Regular,Menlo,monospace':'inherit'}">${isTimed?`▶ ${curSet.reps}${curSet.unit==='min'?'m':'s'}${two?'×2':''}`:curSet.reps}</span>
        </div>
        <span class="ring-cap" id="focus-ex-cap">${isTimed?(two?"2 Côtés<br>(35s • 5s • 35s)":"Chrono<br>(toucher = ▶)"):"Répétitions<br>requises"}</span>
      </div>

      <div class="ring-col">
        <div class="ring-box" onclick="toggleFocusRest(${curIdx})" style="cursor:pointer" title="Toucher pour lancer ou arrêter le repos">
          <svg width="86" height="86" viewBox="0 0 86 86">
            <circle cx="43" cy="43" r="${R}" stroke="#3b1219" stroke-width="5" fill="none"/>
            <circle id="focus-rest-arc" cx="43" cy="43" r="${R}" stroke="#ef4444" stroke-width="5" fill="none" stroke-linecap="round"
              stroke-dasharray="${C_LEN.toFixed(1)}" stroke-dashoffset="0" transform="rotate(-90 43 43)"/>
          </svg>
          <span class="ring-big-txt" id="focus-rest-txt" style="font-size:1rem;font-family:ui-monospace,SFMono-Regular,Menlo,monospace">${fmtSec(rest(ex))}</span>
        </div>
        <span class="ring-cap">Repos<br>(start / stop)</span>
      </div>

      <div class="ring-col">
        <div class="ring-box">
          <svg width="86" height="86" viewBox="0 0 86 86">
            <circle cx="43" cy="43" r="${R}" stroke="#3b1219" stroke-width="5" fill="none"/>
            <circle cx="43" cy="43" r="${R}" stroke="#ef4444" stroke-width="5" fill="none" stroke-linecap="round"
              stroke-dasharray="${C_LEN.toFixed(1)}" stroke-dashoffset="${setDash.toFixed(1)}" transform="rotate(-90 43 43)"/>
          </svg>
          <span class="ring-big-txt">${dn}/${tot}</span>
        </div>
        <span class="ring-cap">Séries<br>réalisées</span>
      </div>
    </div>

    <div class="focus-input-bar">
      <div class="f-inp-box">
        <input type="number" step="0.5" id="f-w" value="${curSet.weight}" class="f-inp">
        <span>Kilogrammes</span>
      </div>
      <div class="f-inp-box">
        <input type="number" id="f-r" value="${curSet.reps}" class="f-inp">
        <span>${curSet.unit==="sec"?"Secondes":curSet.unit==="min"?"Minutes":"Répétitions"}</span>
      </div>
      <button onclick="addFocusSet(${curIdx})" class="btn-plus" title="Valider la série">+</button>
    </div>
    ${nextBtn}

    <div class="row" style="margin-top:.4rem">
      <span style="font-size:.8rem;font-weight:600;color:#64748b">Historique des séries</span>
      <a href="stats.html" style="font-size:.8rem;color:#14b8a6;text-decoration:none;font-weight:600">Graphique ›</a>
    </div>
    ${todayHtml || '<p class="hint" style="text-align:center;padding:.5rem 0">'+(isTimed?'Touche <strong>▶</strong> dans le cercle orange pour lancer le chrono (ou <strong>+</strong> pour valider directement).':'Appuie sur <strong>+</strong> pour valider ta série #'+(activeIdx+1)+'.')+'</p>'}
    ${pastHtml}
  `;
}

function getExTargetSec(ex, setIdx){
  const s=ex.sets[setIdx]||ex.sets[0]||{reps:30,unit:"sec"};
  const val=parseInt($("f-r")?.value)||s.reps||30;
  return s.unit==="min"?val*60:val;
}

function toggleFocusExTimer(i, setIdx){
  startSessionClock();
  if(tEnd>Date.now() && tLabel==="Exercice"){
    exPhaseMax=0; exPhaseTag="";
    stopT();
    updateFocusRings();
    return;
  }
  const ex=prog.exercises[i], s=ex.sets[setIdx]||ex.sets[0];
  /* Valeurs figées au lancement : si on change d'exercice pendant le chrono, la série est quand même validée correctement */
  const fw=$("f-w"), fr=$("f-r");
  const w=fw?(parseFloat(fw.value)||0):s.weight;
  const r=fr?(parseInt(fr.value)||s.reps):s.reps;
  const sec=s.unit==="min"?r*60:r;
  const fin=()=>{exPhaseMax=0; exPhaseTag=""; addFocusSet(i,w,r,true)};

  if(isTwoSided(ex)){
    exPhaseMax=sec; exPhaseTag="Côté 1/2";
    timer(sec,"Exercice",false,()=>{
      exPhaseMax=5; exPhaseTag="Changement !";
      timer(5,"Exercice",false,()=>{
        exPhaseMax=sec; exPhaseTag="Côté 2/2";
        timer(sec,"Exercice",false,fin);
      });
    });
  }else{
    exPhaseMax=sec; exPhaseTag="En cours";
    timer(sec,"Exercice",false,fin);
  }
  updateFocusRings();
}

function toggleFocusRest(i){
  startSessionClock();
  if(tEnd>Date.now() && tLabel==="Repos") stopT();
  else{
    exPhaseMax=0; exPhaseTag="";
    timer(rest(prog.exercises[i])||90,"Repos",true);
  }
  updateFocusRings();
}

function updateFocusRings(){
  if(viewMode!=="focus")return;
  const R=36, C_LEN=2*Math.PI*R;
  const ex=prog.exercises[curIdx];
  const nextIdx=ex.sets.findIndex(s=>!s.done);
  const activeIdx=nextIdx>=0?nextIdx:ex.sets.length-1;
  const curSet=ex.sets[activeIdx]||{reps:12,unit:"reps"};
  const isTimed=(curSet.unit==="sec"||curSet.unit==="min");
  const two=isTwoSided(ex);

  const exArc=$("focus-ex-arc"), exTxt=$("focus-ex-txt"), exCap=$("focus-ex-cap");
  if(exArc && exTxt && isTimed){
    const maxExSec=exPhaseMax||getExTargetSec(ex,activeIdx)||30;
    if(tEnd>Date.now() && tLabel==="Exercice"){
      const rem=Math.max(0,Math.ceil((tEnd-Date.now())/1000));
      const ratio=Math.min(1,rem/maxExSec);
      const isSwitch=(exPhaseTag==="Changement !");
      const col=isSwitch?"#38bdf8":"#fb923c";
      exArc.style.strokeDashoffset=(C_LEN*(1-ratio)).toFixed(1);
      exArc.setAttribute("stroke",col);
      exTxt.style.color=col;
      exTxt.style.fontSize="1rem";
      exTxt.innerText=fmtSec(rem);
      if(exCap) exCap.innerHTML=exPhaseTag||"Chrono";
    }else{
      exArc.style.strokeDashoffset="0";
      exArc.setAttribute("stroke","#fb923c");
      exTxt.style.color="#ffffff";
      const val=parseInt($("f-r")?.value)||curSet.reps;
      exTxt.style.fontSize=two?".8rem":".95rem";
      exTxt.innerText=`▶ ${val}${curSet.unit==='min'?'m':'s'}${two?'×2':''}`;
      if(exCap) exCap.innerHTML=two?`2 Côtés<br>(${val}s • 5s • ${val}s)`:"Chrono<br>(toucher = ▶)";
    }
  }

  const rArc=$("focus-rest-arc"), rTxt=$("focus-rest-txt");
  if(rArc && rTxt){
    const maxS=rest(ex)||90;
    if(tEnd>Date.now() && tLabel==="Repos"){
      const rem=Math.max(0,Math.ceil((tEnd-Date.now())/1000));
      const ratio=Math.min(1,rem/maxS);
      rArc.style.strokeDashoffset=(C_LEN*(1-ratio)).toFixed(1);
      rArc.setAttribute("stroke","#22c55e");
      rTxt.style.color="#22c55e";
      rTxt.innerText=fmtSec(rem);
    }else{
      rArc.style.strokeDashoffset="0";
      rArc.setAttribute("stroke","#ef4444");
      rTxt.style.color="#ffffff";
      rTxt.innerText=maxS>0?fmtSec(maxS):"00:00";
    }
  }
}

function cycleRest(i){
  const cur=rest(prog.exercises[i]);
  prog.exercises[i].restSec=cur===90?60:cur===60?0:90;
  save();render();
}

function nowHM(){
  const d=new Date();
  return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}

/* Valide la prochaine série non faite de l'exercice i.
   w / r : valeurs figées (chrono) ; sinon lues dans les champs si cet exercice est affiché.
   auto = true quand l'appel vient d'un chrono terminé (pas de tap → pas de raccourci iOS). */
function addFocusSet(i,w,r,auto){
  startSessionClock();
  const ex=prog.exercises[i];
  const fw=$("f-w"), fr=$("f-r");
  const useInputs=!auto && viewMode==="focus" && curIdx===i && fw && fr;
  const idx=ex.sets.findIndex(s=>!s.done);
  const ref=ex.sets[idx>=0?idx:ex.sets.length-1]||{weight:0,reps:12,unit:"reps"};
  if(w===undefined) w=useInputs?(parseFloat(fw.value)||0):ref.weight;
  if(r===undefined) r=useInputs?(parseInt(fr.value)||0):ref.reps;
  exPhaseMax=0; exPhaseTag="";
  if(idx>=0){
    const t=ex.sets[idx];
    t.weight=w;t.reps=r;t.done=true;t.time=nowHM();
  }else{
    ex.sets.push({weight:w,reps:r,unit:ex.sets[0]?.unit||"reps",done:true,time:nowHM()});
  }
  save();render();
  if(rest(ex)>0) timer(rest(ex),"Repos",!auto);
}

function uncheckSet(i,setIdx){
  if(!confirm("Annuler la validation de la série #"+(setIdx+1)+" ?"))return;
  prog.exercises[i].sets[setIdx].done=false;
  save();render();
}

function finish(){
  if(!prog.exercises.some(e=>e.sets.some(s=>s.done))){alert("Coche au moins une série avant de terminer.");return}
  if(!confirm("Enregistrer la séance dans l'historique et remettre les séries à zéro ?"))return;
  const durStr=sessStart?fmtSessionDur(Date.now()-sessStart):"";
  const userNote=(prompt("Une note pour cette séance ? (facultatif)")||"").trim();
  const fullNote=[durStr?`Durée : ${durStr}`:"",userNote].filter(Boolean).join(" • ");
  addHist(sessionFromProg(prog,fullNote));
  prog.exercises.forEach(e=>e.sets.forEach(s=>{s.done=false;delete s.time}));
  clearSessionClock();
  save();viewMode="list";render();stopT();
  const m=$("fm");
  if(m){m.innerText="Séance enregistrée dans l'historique (onglet Stats).";m.style.display="block";setTimeout(()=>{m.style.display="none"},4000)}
}

/* ===== Navigation par Swipe Gauche / Droite en mode Focus ===== */
let sx=0, sy=0;
document.addEventListener("touchstart",e=>{
  if(viewMode!=="focus"||!e.touches[0])return;
  sx=e.touches[0].clientX;
  sy=e.touches[0].clientY;
},{passive:true});

document.addEventListener("touchend",e=>{
  if(viewMode!=="focus"||!e.changedTouches[0])return;
  const tag=(e.target&&e.target.tagName)||"";
  if(tag==="INPUT"||tag==="TEXTAREA")return;
  const dx=e.changedTouches[0].clientX-sx;
  const dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>55 && Math.abs(dx)>Math.abs(dy)*1.5){
    if(dx<0 && curIdx<prog.exercises.length-1) openFocus(curIdx+1);
    else if(dx>0 && curIdx>0) openFocus(curIdx-1);
  }
},{passive:true});

mountShell("index.html");
render();
loadRemoteHist();
requestAnimationFrame(frame);
</script>
</body>
</html>
